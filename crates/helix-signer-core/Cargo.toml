[package]
name = "helix-signer-core"
description = "Anubis Automation Script Signer core: plan verification, keys, EIP-7702 signing, chain, website and companion."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "helix_signer_core"
path = "src/lib.rs"

# Pure-Rust dependencies only (no OpenSSL, no system libraries): the crate
# builds for x86_64/aarch64 Linux, Windows, macOS, Android and iOS. TLS is
# rustls with the `ring` provider and the bundled Mozilla roots
# (webpki-roots), so no platform certificate store is needed.
[dependencies]
aes = "0.8"
ctr = "0.9"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
jiff = "0.2"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
ruint = { version = ">=1.12, <1.18", default-features = false, features = ["std"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha3 = "0.10"
tiny_http = "0.12"
unicode-normalization = "0.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
zeroize = { version = "1", features = ["derive"] }

# iOS has no zoneinfo files jiff can rely on: bundle the IANA database there.
[target.'cfg(target_os = "ios")'.dependencies]
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
sha3 = "0.10"
