[package]
name = "helix-signer-cli"
description = "The awake-helix-signer command line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "awake-helix-signer"
path = "src/main.rs"

# Test-only entry points (differential tests, fork runner); never shipped.
[[bin]]
name = "helix-signer-devtool"
path = "src/devtool.rs"

[dependencies]
helix-signer-core = { path = "../helix-signer-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rpassword = "7"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
flate2 = "1"
