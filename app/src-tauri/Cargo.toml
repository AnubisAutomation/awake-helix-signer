[package]
name = "helix-signer-app"
description = "Anubis Automation Script Signer: the Tauri 2 app (Windows, macOS, Linux, Android, iOS)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
default-run = "anubisauto-signer-app"

[lib]
# staticlib/cdylib for the Android and iOS builds, rlib for the desktop binary and tests.
name = "helix_signer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anubisauto-signer-app"
path = "src/main.rs"

[features]
# Development builds only (the end-to-end tests): honour
# AWAKE_HELIX_SIGNER_DEV_CONSTANTS / _RPC / _API with a loopback RPC. Release
# artifacts are built without it, so they always verify against the pinned
# constants and the official website.
dev-constants = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
helix-signer-core = { path = "../../crates/helix-signer-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[dev-dependencies]
tempfile = "3"
